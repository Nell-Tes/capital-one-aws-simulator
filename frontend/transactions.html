<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital One Micro-Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #004a7c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 350px;
        }
        h2 {
            color: #d12e2e;
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #d12e2e;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #a32424;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Deposit or Withdraw!</h2>
    <p>Enter details for a new transaction.</p>
    
    <label>User ID</label>
    <input type="text" id="userId" placeholder="John Doe">

    <label>Amount to Transfer</label>
    <input type="number" id="amountTransfered" placeholder="1000">

    <button onclick="createTransaction('Withdrawal')">Withdrawal</button>
    <button onclick="createTransaction('Deposit')">Deposit</button>

    <a href="index.html">
        <button>Go Back</button>
    </a>

    <div id="status"></div>
</div>

<script>
async function createTransaction(type) {
    const userId = document.getElementById('userId').value;
    const amountTransfered = document.getElementById('amountTransfered').value;

    if(!userId || !amountTransfered) {
        alert("Please fill in all fields");
        return;
    }

    const statusDiv = document.getElementById('status');
    statusDiv.innerText = `Processing ${userId}'s application...`;

    const apiURL = "https://j7tffvgwf6.execute-api.us-east-1.amazonaws.com/default/CreateTransaction"; 

    try {
        const response = await fetch(apiURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: userId, amountTransfered: amountTransfered, type: type })
        });

        const result = await response.json();
        if (result.id) {
            statusDiv.innerHTML = `<b style="color: green;">Success! Account ID: ${result.id}</b>`;
        } else {
            statusDiv.innerHTML = `<b style="color: green;">Error! ${result.error}</b>`;
        }
    } catch (error) {
        statusDiv.innerHTML = `<b style="color: red;">Error connecting to Bank Servers.</b>`;
        console.error(error);
    }
}
</script>

</body>
</html>
